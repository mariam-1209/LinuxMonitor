<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux Monitor</title><style>
*{box-sizing:border-box}body{margin:0;background:#10141e;color:#e7edf7;font:15px system-ui}main{max-width:1100px;margin:auto;padding:28px}h1{margin:0}p{color:#9baac1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}article,section{background:#1a2231;border:1px solid #303d51;border-radius:14px;padding:18px}article strong{display:block;font-size:30px;margin-top:10px}section{margin-top:18px}canvas{width:100%;height:210px}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:10px;border-bottom:1px solid #303d51}input{background:#10141e;color:white;border:1px solid #536078;padding:10px;border-radius:8px;width:100%;margin-bottom:10px}.legend{color:#9baac1}.scroll{overflow:auto}#status{color:#a7d8b5}</style><main><h1>Linux Resource Monitor</h1><p id="status">Connecting…</p><div class="cards" id="cards"></div><section><h2>Resource history</h2><p class="legend">Blue: CPU · Green: RAM · Orange: disk · Last 60 samples</p><canvas id="chart" aria-label="Resource history chart"></canvas></section><section><h2 id="processTitle">Processes</h2><input id="search" placeholder="Filter top 50 by name or PID" aria-label="Filter processes"><div class="scroll"><table><thead><tr><th>PID</th><th>Process</th><th>Resident memory (MiB)</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id), history=[], keys=['cpu','ram','disk'], colors=['#60a5fa','#34d399','#fb923c'];let processes=[];
function draw(){const c=$('chart'),w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);x.font='11px system-ui';for(let v=0;v<=100;v+=25){let y=10+(100-v)*(h-30)/100;x.strokeStyle='#303d51';x.beginPath();x.moveTo(35,y);x.lineTo(w-8,y);x.stroke();x.fillStyle='#9baac1';x.fillText(v+'%',0,y+4)}keys.forEach((k,j)=>{x.strokeStyle=colors[j];x.lineWidth=2;x.beginPath();let started=false;history.forEach((s,i)=>{if(s[k]<0){started=false;return}let px=35+i*(w-43)/59,py=10+(100-s[k])*(h-30)/100;if(started)x.lineTo(px,py);else x.moveTo(px,py);started=true});x.stroke()})}
function rows(){const q=$('search').value.toLowerCase();$('rows').replaceChildren();for(const p of processes.filter(p=>(p.name+' '+p.pid).toLowerCase().includes(q))){const tr=document.createElement('tr');for(const v of [p.pid,p.name,(p.rss/1024).toFixed(1)]){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('rows').append(tr)}}
$('search').addEventListener('input',rows);window.addEventListener('resize',draw);
async function refresh(){try{const r=await fetch('/api/metrics',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error(r.status);const s=await r.json();$('status').textContent='Live • '+new Date().toLocaleTimeString();$('cards').replaceChildren();for(const [label,value] of [['CPU',s.cpu],['RAM',s.ram],['Swap',s.swap],['Root disk',s.disk],['Uptime',s.uptime]]){const a=document.createElement('article'),b=document.createElement('strong');a.textContent=label;b.textContent=value<0?'N/A':label==='Uptime'?Math.floor(value/3600)+'h '+Math.floor(value%3600/60)+'m':value.toFixed(1)+'%';a.append(b);$('cards').append(a)}history.push(s);if(history.length>60)history.shift();draw();processes=s.processes;$('processTitle').textContent='Processes · '+s.count+' readable · top 50 by RAM';rows()}catch(e){$('status').textContent='Disconnected — retrying'}finally{setTimeout(refresh,1000)}}refresh();</script></html>
